name: Monitor NF-e
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['monitor.py','tests/**','.github/workflows/monitor.yml','docs/index.html','docs/api/models.json']
concurrency:
  group: dfe-publication
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - name: Coleta oficial
        id: coleta
        continue-on-error: true
        run: python monitor.py nfe
      - name: Registra situação da coleta
        env:
          RESULT: ${{ steps.coleta.outcome }}
        run: |
          mkdir -p docs/api/
          python -c 'import json, os, datetime; from pathlib import Path; Path("docs/api/status.json").write_text(json.dumps(dict(status=os.environ["RESULT"], consulta=datetime.datetime.now(datetime.timezone.utc).isoformat())))'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/api/*.json docs/api/daily.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Atualiza estatísticas NF-e'
            git pull --rebase origin main
            git push origin main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
