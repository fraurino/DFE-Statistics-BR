name: DFE | National Data Pipeline
run-name: DFE | ${{ github.event_name == 'schedule' && 'Scheduled checkpoint' || 'Operational revision' }}
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['monitor.py','pipeline.py','provider_nfce.py','tests/**','.github/workflows/monitor.yml','docs/index.html','docs/api/models.json']
concurrency:
  group: dfe-publication
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runtime dependencies
        run: python -m pip install requests
      - name: Integrity validation
        run: python -m unittest discover -s tests
      - name: Provider synchronization
        run: python pipeline.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Repository checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/api
          if ! git diff --cached --quiet; then
            git commit -m 'data(sync): operational checkpoint'
            git pull --rebase origin main
            git push origin main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
